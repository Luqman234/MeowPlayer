name: Package Smoke Test

on:
  push:
    branches: [main]
    paths:
      - "meowplayer.py"
      - "album_art.py"
      - "bad_larry.py"
      - "bad_larry_math.py"
      - "lyrics_support.py"
      - "library_watcher.py"
      - "meow_catalog.py"
      - "meow_smart.py"
      - "meow_persistence.py"
      - "meow_logging.py"
      - "mpris_support.py"
      - "online_metadata.py"
      - "visualizer.py"
      - "youtube_online.py"
      - "pyproject.toml"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/package-smoke.yml"
  pull_request:
    paths:
      - "meowplayer.py"
      - "album_art.py"
      - "lyrics_support.py"
      - "library_watcher.py"
      - "meow_catalog.py"
      - "meow_smart.py"
      - "meow_persistence.py"
      - "meow_logging.py"
      - "mpris_support.py"
      - "visualizer.py"
      - "pyproject.toml"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/package-smoke.yml"

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python modules
        run: |
          python -m py_compile meowplayer.py album_art.py bad_larry.py bad_larry_math.py lyrics_support.py library_watcher.py meow_catalog.py meow_smart.py meow_persistence.py meow_logging.py mpris_support.py online_metadata.py visualizer.py youtube_online.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build wheel and source distribution
        run: python -m build

      - name: Install built wheel
        run: |
          python -m venv /tmp/meowplayer-smoke
          /tmp/meowplayer-smoke/bin/pip install dist/*.whl

      - name: Verify installed CLI
        run: |
          /tmp/meowplayer-smoke/bin/meowplayer --version
          /tmp/meowplayer-smoke/bin/meowplayer --help >/dev/null

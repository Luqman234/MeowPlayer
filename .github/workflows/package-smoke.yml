name: Package Smoke Test

on:
  push:
    branches: [main]
    paths:
      - "meowplayer.py"
      - "meow_persistence.py"
      - "mpris_support.py"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/package-smoke.yml"
  pull_request:
    paths:
      - "meowplayer.py"
      - "meow_persistence.py"
      - "mpris_support.py"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/package-smoke.yml"

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python modules
        run: |
          python -m py_compile meowplayer.py meow_persistence.py mpris_support.py

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build wheel and source distribution
        run: python -m build

      - name: Install built wheel
        run: |
          python -m venv /tmp/meowplayer-smoke
          /tmp/meowplayer-smoke/bin/pip install dist/*.whl

      - name: Verify installed CLI
        run: |
          /tmp/meowplayer-smoke/bin/meowplayer --version
          /tmp/meowplayer-smoke/bin/meowplayer --help >/dev/null

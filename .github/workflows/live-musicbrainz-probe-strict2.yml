name: Live MusicBrainz Probe Strict 2

on:
  pull_request:
    paths:
      - '.github/workflows/live-musicbrainz-probe-strict2.yml'

permissions:
  contents: read

jobs:
  live-musicbrainz-strict2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe strict MusicBrainz matching
        run: |
          python - <<'PY'
          from online_metadata import MusicBrainzClient

          client = MusicBrainzClient(timeout=12.0)
          snapshot = {
              'path': '/tmp/Space Song.flac',
              'title': 'Space Song',
              'artist': 'Beach House',
              'album': '',
              'duration': 0.0,
              'missing': ('album', 'album_artist', 'year', 'genre'),
          }

          query = 'recording:"Space Song" AND artistname:"Beach House"'
          payload, status = client._request_json(
              '/recording/',
              {'query': query, 'fmt': 'json', 'limit': 25},
          )
          print('QUERY_STATUS:', status)
          recordings = (payload or {}).get('recordings', [])
          print('CANDIDATE_COUNT:', len(recordings))
          for index, recording in enumerate(recordings):
              credits = recording.get('artist-credit') or []
              artists = ' / '.join(
                  str(item.get('name') or '')
                  for item in credits
                  if isinstance(item, dict)
              )
              print(
                  'CANDIDATE', index,
                  'score=', recording.get('score'),
                  'title=', recording.get('title'),
                  'artist=', artists,
                  'id=', recording.get('id'),
              )

          result = client.fetch(snapshot)
          print('FETCH_RESULT:', result.status, result.title, result.artist, result.source_id)
          PY
